[tool.poetry]
name = "vpt_plugin_cellpose2"
version = "1.0.1"
description = "Cellpose 2 Plugin for VPT"
license = "Apache-2.0"
authors = ["Vizgen <techsupport@vizgen.com>"]
maintainers = ["Timothy Wiggin <timothy.wiggin@vizgen.com>"]
readme = "README.md"
repository = "https://github.com/Vizgen/vpt-plugin-cellpose2"
documentation = "https://vizgen.github.io/vizgen-postprocessing/"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "vpt_plugin_cellpose2*", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
cellpose = ">=2,<3"
aiohttp = ">=3.9.3,<4.0.0"
fastremap = ">=1.18.0,<2.0.0"
fsspec = "2024.2.0"
gcsfs = "2024.2.0"
fiona = ">=1.10.1,<1.11.0"
numba = ">=0.60.0"
numpy = ">=1.24.3,<3"
pandas = ">=2.0.3"
pywavelets = ">=1.8.0,<1.9.0"
pyproj = ">=3.6.1,<3.7.0"
scikit-image = ">=0.25.2,<0.26.0"
shapely = ">=2.1.2,<2.2.0"
torch = ">=2.3.0,<2.5.0"
torchvision = ">=0.18.0,<0.20.0"
multidict = ">=6.7.1,<7.0.0"
vpt_core = { git = "https://github.com/bgruening/vpt-core", branch = "py312" }

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
pytest-cov = "^4.0.0"
opencv-python-headless = ">=4.10.0.82"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[tool.poetry.group.deploy.dependencies]
python-semantic-release = "^7.32.2"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_variable = "pyproject.toml:version"
branch = "develop"
changelog_file = "CHANGELOG.md"
build_command = "poetry build"
dist_path = "dist/"
upload_to_release = true
upload_to_pypi = false
remove_dist = false
patch_without_tag = true
